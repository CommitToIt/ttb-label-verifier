<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TTB Label Verifier</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24323d;
      background: #f4f1ea;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(68rem, calc(100% - 2rem)); margin: 0 auto; padding: 2.5rem 0 4rem; }
    h1 { margin: 0 0 0.45rem; font-size: clamp(1.8rem, 4vw, 2.7rem); }
    h2 { margin: 0; font-size: 1.2rem; }
    p { line-height: 1.5; }
    .intro { margin: 0 0 1.5rem; color: #53636e; }
    .upload-area { border: 2px dashed #778b96; border-radius: 0.5rem; padding: 1.8rem; text-align: center; background: #fffdf8; transition: border-color 160ms, background 160ms; }
    .upload-area.is-dragging { border-color: #1f6f78; background: #edf8f6; }
    .upload-area p { margin: 0 0 1rem; }
    .file-button, button { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 0.35rem; padding: 0.7rem 1rem; font: inherit; font-weight: 650; cursor: pointer; }
    .file-button, #verify-button { background: #1f6f78; color: white; }
    .file-button:hover, #verify-button:hover:not(:disabled) { background: #185861; }
    input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .items { display: grid; gap: 1rem; margin-top: 1.25rem; }
    .label-item { display: grid; grid-template-columns: minmax(10rem, 15rem) 1fr; gap: 1.25rem; padding: 1rem; border: 1px solid #d4d9d5; border-radius: 0.5rem; background: #fffdf8; }
    .preview { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #e8ece8; border-radius: 0.3rem; }
    .file-name { margin: 0.5rem 0 0; overflow-wrap: anywhere; color: #53636e; font-size: 0.85rem; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
    label { display: grid; gap: 0.3rem; color: #42515b; font-size: 0.9rem; font-weight: 650; }
    input[type="text"] { width: 100%; border: 1px solid #aebcc2; border-radius: 0.3rem; padding: 0.62rem; background: white; color: inherit; font: inherit; }
    .import-control { display: flex; align-items: center; gap: 0.45rem; grid-column: 1 / -1; }
    .import-control label { display: flex; align-items: center; gap: 0.45rem; }
    .remove-button { margin-top: 0.8rem; padding: 0.45rem 0.65rem; background: #eef0ed; color: #485862; font-size: 0.85rem; }
    .remove-button:hover { background: #e0e5e1; }
    .actions { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.25rem; }
    #verify-button:disabled { cursor: not-allowed; opacity: 0.5; }
    .message { margin: 1rem 0 0; color: #8a3f2f; }
    .results { margin-top: 2rem; }
    .overall { display: inline-block; margin: 0.8rem 0 1rem; border-radius: 0.3rem; padding: 0.45rem 0.7rem; font-weight: 750; text-transform: capitalize; }
    .result-list { display: grid; gap: 0.8rem; }
    .result-item { border-left: 0.35rem solid #778b96; padding: 0.8rem 1rem; background: #fffdf8; }
    .result-item.status-pass, .status-pass { border-color: #2f815d; color: #205c43; }
    .result-item.status-fail, .status-fail { border-color: #b44f43; color: #87352e; }
    .result-item.status-needs-review, .status-needs-review { border-color: #bd812e; color: #805817; }
    .field-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.45rem 1rem; margin: 0.8rem 0 0; }
    .field-result { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: baseline; border-top: 1px solid #e1e4df; padding-top: 0.45rem; }
    .field-name { font-weight: 700; }
    .field-reason { flex-basis: 100%; font-size: 0.85rem; color: #53636e; }
    @media (max-width: 680px) {
      .label-item { grid-template-columns: 1fr; }
      .form-grid, .field-results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>TTB Label Verifier</h1>
    <p class="intro">Add label images, enter the submitted application data beside each image, and verify the complete set together.</p>
    <section id="upload-area" class="upload-area" aria-label="Label upload">
      <p>Drop label images here or choose files.</p>
      <label class="file-button" for="file-input">Choose images</label>
      <input id="file-input" type="file" accept="image/*" multiple>
    </section>
    <section id="label-items" class="items" aria-live="polite"></section>
    <div class="actions">
      <button id="verify-button" type="button" disabled>Verify labels</button>
      <span id="request-message" class="message" role="status"></span>
    </div>
    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
